<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KOF Retro - 拳皇怀旧格斗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;font-family:'Courier New',monospace}

/* Screens */
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);z-index:10;pointer-events:all}
.screen.active{display:flex}
#start-screen h1{font-size:16vw;color:#ff4444;text-shadow:0 0 20px #ff0000,3px 3px 0 #880000;letter-spacing:6px;animation:pulse 1.5s ease-in-out infinite}
#start-screen h2{font-size:5vw;color:#ffcc00;text-shadow:0 0 10px #ff8800;margin:1vh 0}
#start-screen .sub{font-size:3vw;color:#888;margin-bottom:3vh}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* Character Select */
#select-screen{padding:2vh}
#select-screen h2{font-size:6vw;color:#ffcc00;text-shadow:0 0 10px #ff8800;margin-bottom:1vh}
.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;width:90%;max-width:500px;margin:1vh auto}
.char-card{background:rgba(40,20,60,0.8);border:2px solid #444;border-radius:4px;padding:1.5vw;text-align:center;cursor:pointer;transition:all 0.2s}
.char-card.selected{border-color:#ffcc00;background:rgba(100,60,0,0.5);box-shadow:0 0 15px rgba(255,200,0,0.5)}
.char-card canvas{display:block;margin:0 auto;width:100%;image-rendering:pixelated}
.char-card .cname{font-size:2.5vw;color:#fff;margin-top:0.5vh}
.char-card .ctype{font-size:2vw;color:#aaa}
.char-info{margin:2vh 0;text-align:center}
.char-info h3{font-size:5vw;color:#ff4444}
.char-info p{font-size:3vw;color:#aaa;margin:0.5vh 0}
#btn-fight{font-size:5vw;padding:1.5vh 10vw;background:linear-gradient(180deg,#ff4444,#cc0000);color:#fff;border:2px solid #ff8888;border-radius:4px;cursor:pointer;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0.7}}

/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;padding:1vh 2vw;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.health-bar-container{width:35%;height:3vh;background:#222;border:2px solid #888;border-radius:2px;overflow:hidden}
.health-bar{height:100%;transition:width 0.3s}
#p1-health{background:linear-gradient(180deg,#44ff44,#00aa00);float:right}
#p2-health{background:linear-gradient(180deg,#44ff44,#00aa00)}
.health-bar-container.p1{float:right}
#p1-name,#p2-name{font-size:2.5vw;color:#fff;text-shadow:1px 1px 0 #000;position:absolute;top:3.5vh}
#p1-name{left:2vw}#p2-name{right:2vw}
#timer{font-size:5vw;color:#ffcc00;text-shadow:0 0 10px #ff8800,2px 2px 0 #000;min-width:10vw;text-align:center}
#round-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12vw;color:#ffcc00;text-shadow:0 0 30px #ff8800,3px 3px 0 #884400;display:none;z-index:5;animation:roundPop 0.8s ease-out}
@keyframes roundPop{0%{transform:translate(-50%,-50%) scale(3);opacity:0}60%{transform:translate(-50%,-50%) scale(0.9);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#combo-display{position:absolute;top:15vh;right:5vw;font-size:6vw;color:#ff4444;text-shadow:0 0 15px #ff0000,2px 2px 0 #000;display:none}

/* Controls */
#controls{position:absolute;bottom:0;left:0;width:100%;height:35vh;pointer-events:all;display:flex;justify-content:space-between;align-items:flex-end;padding:0 3vw 2vh}
#joystick-area{width:30vw;height:30vw;position:relative;max-width:150px;max-height:150px}
#joystick-base{width:100%;height:100%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:50%;position:relative}
#joystick-stick{width:40%;height:40%;background:rgba(255,255,255,0.5);border:2px solid rgba(255,255,255,0.7);border-radius:50%;position:absolute;top:30%;left:30%}
#btn-group{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2vw;width:35vw;height:30vw;max-width:180px;max-height:180px}
.btn-attack{border-radius:50%;border:2px solid;font-size:3.5vw;font-weight:bold;color:#fff;text-shadow:1px 1px 0 #000;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btn-punch{background:rgba(255,100,100,0.6);border-color:#ff4444;grid-column:1;grid-row:2}
#btn-kick{background:rgba(100,100,255,0.6);border-color:#4444ff;grid-column:2;grid-row:2}
#btn-special{background:rgba(255,200,0,0.6);border-color:#ffcc00;grid-column:2;grid-row:1}
#btn-guard{background:rgba(100,255,100,0.6);border-color:#44ff44;grid-column:1;grid-row:1}
.btn-attack:active,.btn-attack.active{transform:scale(0.9);filter:brightness(1.5)}
#scanlines{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px);pointer-events:none;opacity:0.3}

/* Winner */
#winner-screen{z-index:15}
#winner-screen h1{font-size:10vw;color:#ffcc00;text-shadow:0 0 30px #ff8800,3px 3px 0 #884400}
#winner-screen button{font-size:4vw;padding:1.5vh 6vw;background:#cc0000;color:#fff;border:2px solid #ff4444;border-radius:4px;margin-top:3vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-overlay">
  <div id="hud">
    <div class="health-bar-container p1"><div class="health-bar" id="p1-health" style="width:100%"></div></div>
    <div id="timer">99</div>
    <div class="health-bar-container"><div class="health-bar" id="p2-health" style="width:100%"></div></div>
    <div id="p1-name">P1</div>
    <div id="p2-name">CPU</div>
  </div>
  <div id="round-text"></div>
  <div id="combo-display"></div>
  <div id="controls">
    <div id="joystick-area"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
    <div id="btn-group">
      <div class="btn-attack" id="btn-guard">防</div>
      <div class="btn-attack" id="btn-special">必</div>
      <div class="btn-attack" id="btn-punch">拳</div>

</div>

  <button id="btn-start" style="font-size:5vw;padding:2vh 8vw;background:linear-gradient(180deg,#ff4444,#cc0000);color:#fff;border:2px solid #ff8888;border-radius:4px;cursor:pointer;font-family:'Courier New',monospace;text-shadow:1px 1px 0 #000">- START GAME -</button>
</div>

<div class="screen" id="select-screen">
  <h2>SELECT FIGHTER</h2>
  <div class="char-grid" id="char-grid"></div>
  <div class="char-info" id="char-info"><h3>选择你的角色</h3><p></p></div>
  <button id="btn-fight">FIGHT!</button>
</div>

<div class="screen" id="winner-screen">
  <h1 id="winner-text"></h1>
  <button id="btn-restart">再来一局</button>
</div>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, SCALE;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  SCALE = Math.min(W / 800, H / 600);
}
resize();
window.addEventListener('resize', resize);

const STAGE_DEPTH = 200;
const GRAVITY = 0.6;
const MAX_ROUNDS = 3;

let GROUND_Y, STAGE_WIDTH_MIN, STAGE_WIDTH_MAX;
function updateStageBounds() {
  GROUND_Y = H * GROUND_Y_BASE;
  STAGE_WIDTH_MIN = W * 0.15;
  STAGE_WIDTH_MAX = W * 0.85;
}
updateStageBounds();
window.addEventListener('resize', updateStageBounds);

// ============================================================
// SPRITE RENDERING WITH CACHE
// ============================================================
const spriteCache = {};

function renderSprite(spriteData, palette, scaleX, scaleY, hairData, hairColor) {
  const hairKey = hairData ? JSON.stringify(hairData) : '';
  const key = JSON.stringify(spriteData).substring(0,50) + JSON.stringify(palette) + scaleX.toFixed(2) + scaleY.toFixed(2) + hairKey + (hairColor||'');
  if (spriteCache[key]) return spriteCache[key];

  const sw = spriteData[0].length;
  const sh = spriteData.length;
  const px = Math.ceil(sw * scaleX);
  const py = Math.ceil(sh * scaleY);
  const off = document.createElement('canvas');
  off.width = px; off.height = py;
  const oc = off.getContext('2d');

  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const v = spriteData[y][x];
      if (v === 0) continue;
      oc.fillStyle = palette[v] || '#ff00ff';
      oc.fillRect(Math.floor(x * scaleX), Math.floor(y * scaleY), Math.ceil(scaleX), Math.ceil(scaleY));
    }
  }
  // Hair overlay
  if (hairData && hairColor) {
    for (let y = 0; y < hairData.length; y++) {
      for (let x = 0; x < hairData[y].length; x++) {
        if (hairData[y][x] === 8) {
          oc.fillStyle = hairColor;
          oc.fillRect(Math.floor(x * scaleX), Math.floor(y * scaleY), Math.ceil(scaleX), Math.ceil(scaleY));
        }
      }
    }
  }
  spriteCache[key] = off;
  return off;
}

    this.facing = facing;
    this.charData = charData;
    this.sprites = generateSpriteSet(charData);
    this.hair = HAIR_STYLES[charData.hairStyle] || [];
    this.hp = 100;
    this.state = 'idle';
    this.stateTimer = 0;
    this.attackHit = false;
    this.combo = 0;
    this.comboTimer = 0;
    this.hitstun = 0;
    this.flashTimer = 0;
    this.specialMeter = 0;
  }

  get spriteW() { return 16; }
  get spriteH() { return 22; }

  getScreenPos() {
    const df = 0.5 + this.z * 0.5;
    const gy = GROUND_Y - (1 - this.z) * STAGE_DEPTH * 0.3;
    return { x: this.x, y: gy - this.y, scale: df };
  }

  getDraw() {
    const p = this.getScreenPos();
    const bs = 3.5 * SCALE;
    const s = bs * p.scale;
    return { w: this.spriteW * s, h: this.spriteH * s, scale: s, sx: p.x, sy: p.y };
  }

  getHitbox() {
    const d = this.getDraw();
    return { x: d.sx - d.w * 0.3, y: d.sy - d.h, w: d.w * 0.6, h: d.h };
  }

  getAttackBox() {
    if (this.state !== 'punch' && this.state !== 'kick' && this.state !== 'special') return null;
    if (this.attackHit) return null;
    const d = this.getDraw();
    const r = this.state === 'special' ? d.w * 1.5 : (this.state === 'kick' ? d.w * 1.0 : d.w * 0.8);
    return { x: this.facing === 1 ? d.sx : d.sx - r, y: d.sy - d.h * 0.7, w: r, h: d.h * 0.5 };
  }

  update(dt, opp) {
    if (this.state !== 'hit' && this.state !== 'punch' && this.state !== 'kick' && this.state !== 'special')
      this.facing = opp.x > this.x ? 1 : -1;
    if (this.stateTimer > 0) {
      this.stateTimer -= dt;
      if (this.stateTimer <= 0) {
        if (['punch','kick','special'].includes(this.state)) { this.state = 'idle'; this.attackHit = false; }
        if (this.state === 'hit') { this.state = 'idle'; this.hitstun = 0; }
      }
    }
    if (this.hitstun > 0) { this.hitstun -= dt; this.state = 'hit'; }
    if (this.flashTimer > 0) this.flashTimer -= dt;
    if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 0; }
    this.x += this.vx * dt;
    this.z += this.vz * dt;
    this.z = Math.max(0.2, Math.min(1, this.z));
    const d = this.getDraw();
    this.x = Math.max(STAGE_WIDTH_MIN + d.w / 2, Math.min(STAGE_WIDTH_MAX - d.w / 2, this.x));
    if (!this.grounded) {
      this.vy += GRAVITY;
      this.y -= this.vy;
      if (this.y <= 0) { this.y = 0; this.vy = 0; this.grounded = true; }
    }
    if (this.specialMeter < 100) this.specialMeter = Math.min(100, this.specialMeter + dt * 3);
  }

  punch() { if (this.state === 'idle' || this.state === 'walk') { this.state = 'punch'; this.stateTimer = 0.3; this.attackHit = false; } }
  kick() { if (this.state === 'idle' || this.state === 'walk') { this.state = 'kick'; this.stateTimer = 0.4; this.attackHit = false; } }
  special() { if (this.specialMeter < 50 || (this.state !== 'idle' && this.state !== 'walk')) return; this.state = 'special'; this.stateTimer = 0.6; this.attackHit = false; this.specialMeter -= 50; }
  guard() { if (this.state === 'idle' || this.state === 'walk' || this.state === 'guard') this.state = 'guard'; }
  unguard() { if (this.state === 'guard') this.state = 'idle'; }
  jump() { if (!this.grounded) return; this.grounded = false; this.vy = 12; }

  takeDamage(dmg, atkX) {
    if (this.state === 'guard') { dmg = Math.floor(dmg * 0.2); this.hitstun = 0.1; }
    else { this.hitstun = 0.4; this.state = 'hit'; }
    this.hp = Math.max(0, this.hp - dmg);
    this.flashTimer = 0.15;
    this.x += (atkX < this.x ? 3 : -3);
  }

  draw(ctx) {
    const d = this.getDraw();
    const sd = this.sprites[this.state] || this.sprites.idle;
    let oy = 0;
    if (this.state === 'idle') oy = Math.sin(Date.now() / 300) * 2 * d.scale;
    if (this.state === 'hit') oy = Math.sin(Date.now() / 50) * 3 * d.scale;

    ctx.save();
    if (this.flashTimer > 0 && Math.floor(this.flashTimer * 30) % 2 === 0) ctx.globalAlpha = 0.5;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(d.sx, d.sy + 2, d.w * 0.4, d.w * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Sprite
    const pal = this.charData.palette;
    const img = renderSprite(sd, pal, d.scale, d.scale, this.hair, pal[8]);
    const dx = d.sx - d.w / 2;
    const dy = d.sy - d.h + oy;

    if (this.facing === -1) {
      ctx.save();
      ctx.translate(d.sx, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, -d.w / 2, dy);
      ctx.restore();
    } else {
      ctx.drawImage(img, dx, dy);
    }

    // Special aura
    if (this.state === 'special') {
      const prog = 1 - (this.stateTimer / 0.6);
      const rad = d.w * 0.8 * prog;
      ctx.strokeStyle = this.charData.specialColor;
      ctx.lineWidth = 3 * d.scale;
      ctx.globalAlpha = 0.7 * (1 - prog);
      ctx.beginPath();
      ctx.arc(d.sx + this.facing * d.w * 0.3, d.sy - d.h * 0.5, rad, 0, Math.PI * 2);
      ctx.stroke();
      // Energy particles
      for (let i = 0; i < 5; i++) {
        const angle = (Date.now() / 100 + i * 1.26) % (Math.PI * 2);
        const pr = d.w * 0.6 * prog;
        const px = d.sx + Math.cos(angle) * pr;
        const py = d.sy - d.h * 0.5 + Math.sin(angle) * pr;
        ctx.fillStyle = this.charData.specialColor;
        ctx.globalAlpha = 0.8 * (1 - prog);
        ctx.fillRect(px - 2, py - 2, 4, 4);
      }
    }

    ctx.restore();

    // Name tag
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(10, 12 * SCALE)}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.fillText(this.charData.name, d.sx, d.sy + 15 * d.scale);
  }

  reset(x) {
    this.x = x; this.z = 0.7;
    this.vx = 0; this.vz = 0; this.vy = 0; this.y = 0;
    this.grounded = true; this.hp = 100; this.state = 'idle';
    this.stateTimer = 0; this.attackHit = false;
    this.combo = 0; this.comboTimer = 0; this.hitstun = 0;
    this.flashTimer = 0; this.specialMeter = 0;
  }
}

// ============================================================
// AI
// ============================================================
const AI = {
  thinkTimer: 0, action: 'idle', actionTimer: 0,
  update(dt, cpu, player) {
    this.thinkTimer -= dt; this.actionTimer -= dt;
    if (this.thinkTimer <= 0) { this.thinkTimer = 0.3 + Math.random() * 0.4; this.decide(cpu, player); }
    if (this.actionTimer > 0) this.exec(cpu, player);
    else { cpu.vx = 0; cpu.vz = 0; }
  },
  decide(cpu, player) {
    const dist = Math.abs(player.x - cpu.x);
    const d = cpu.getDraw();
    const close = d.w * 1.2, mid = d.w * 2.5;
    if (['punch','kick','special'].includes(player.state) && dist < mid && Math.random() < 0.5) {
      this.action = 'guard'; this.actionTimer = 0.5; return;
    }
    if (dist > mid) { this.action = 'approach'; this.actionTimer = 0.5; }
    else if (dist < close) {
      const r = Math.random();
      if (r < 0.35) this.action = 'punch';
      else if (r < 0.6) this.action = 'kick';
      else if (r < 0.7 && cpu.specialMeter >= 50) this.action = 'special';
      else this.action = 'retreat';
      this.actionTimer = 0.3;
    } else {
      const r = Math.random();
      if (r < 0.4) { this.action = 'approach'; this.actionTimer = 0.3; }
      else if (r < 0.6) { this.action = 'punch'; this.actionTimer = 0.3; }
      else if (r < 0.75) { this.action = Math.random() < 0.5 ? 'depthUp' : 'depthDown'; this.actionTimer = 0.3; }
      else { this.action = 'idle'; this.actionTimer = 0.2; }
    }
  },
  exec(cpu, player) {
    const spd = 200; cpu.vx = 0; cpu.vz = 0;
    switch (this.action) {
      case 'approach': cpu.vx = (player.x > cpu.x ? 1 : -1) * spd; break;
      case 'retreat': cpu.vx = (player.x > cpu.x ? -1 : 1) * spd * 0.7; break;
      case 'punch': cpu.punch(); this.actionTimer = 0; break;
      case 'kick': cpu.kick(); this.actionTimer = 0; break;
      case 'special': cpu.special(); this.actionTimer = 0; break;
      case 'guard': cpu.guard(); break;
      case 'depthUp': cpu.vz = -spd * 0.003; break;
      case 'depthDown': cpu.vz = spd * 0.003; break;
    }
  }
};

// ============================================================
// COLLISION
// ============================================================
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function checkAttack(atk, def) {
  const ab = atk.getAttackBox();
  if (!ab) return;
  if (!rectsOverlap(ab, def.getHitbox())) return;
  atk.attackHit = true;
  const cd = atk.charData.stats;
  let dmg = atk.state === 'punch' ? (8 + Math.random() * 4) * cd.atk :
            atk.state === 'kick' ? (12 + Math.random() * 5) * cd.atk :
            (25 + Math.random() * 10) * cd.atk;
  atk.combo++; atk.comboTimer = 1.5;
  if (atk.combo > 1) dmg *= (1 + atk.combo * 0.15);
  dmg = Math.floor(dmg * (1 / def.charData.stats.def));
  def.takeDamage(dmg, atk.x);
  hitPause = 0.05;
  if (atk.combo > 1) showCombo(atk.combo);
}

// ============================================================
// INPUT
// ============================================================
const input = { dx: 0, dy: 0, punch: false, kick: false, special: false, guard: false };
const joystickArea = document.getElementById('joystick-area');
const joystickStick = document.getElementById('joystick-stick');
let joystickTouch = null, joystickCenter = { x: 0, y: 0 };

joystickArea.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickTouch = e.changedTouches[0].identifier;
  const r = joystickArea.getBoundingClientRect();
  joystickCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  handleJoy(e.changedTouches[0]);
});
joystickArea.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joystickTouch) handleJoy(t);
});
joystickArea.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === joystickTouch) {
    joystickTouch = null; input.dx = 0; input.dy = 0;
    joystickStick.style.transform = 'translate(0,0)';
  }
});
function handleJoy(t) {
  const r = joystickArea.getBoundingClientRect();
  const mr = r.width / 2;
  let dx = t.clientX - joystickCenter.x, dy = t.clientY - joystickCenter.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > mr) { dx = dx / dist * mr; dy = dy / dist * mr; }
  input.dx = dx / mr; input.dy = dy / mr;
  joystickStick.style.transform = `translate(${dx * 0.6}px, ${dy * 0.6}px)`;
}

function setupBtn(id, key) {
  const b = document.getElementById(id);
  b.addEventListener('touchstart', e => { e.preventDefault(); input[key] = true; b.classList.add('active'); });
  b.addEventListener('touchend', e => { input[key] = false; b.classList.remove('active'); });
  b.addEventListener('mousedown', e => { input[key] = true; b.classList.add('active'); });
  b.addEventListener('mouseup', e => { input[key] = false; b.classList.remove('active'); });
}
setupBtn('btn-punch', 'punch'); setupBtn('btn-kick', 'kick');
setupBtn('btn-special', 'special'); setupBtn('btn-guard', 'guard');

const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function processInput() {
  const spd = 250 * p1.charData.stats.spd;
  p1.vx = 0; p1.vz = 0;
  let dx = input.dx, dy = input.dy;
  if (keys.ArrowLeft || keys.a) dx = -1;
  if (keys.ArrowRight || keys.d) dx = 1;
  if (keys.ArrowUp || keys.w) dy = -1;
  if (keys.ArrowDown || keys.s) dy = 1;
  if (Math.abs(dx) > 0.2) p1.vx = dx * spd;
  if (Math.abs(dy) > 0.2) p1.vz = dy * spd * 0.003;
  if (input.punch || keys.j) { p1.punch(); input.punch = false; keys.j = false; }
  if (input.kick || keys.k) { p1.kick(); input.kick = false; keys.k = false; }
  if (input.special || keys.l) { p1.special(); input.special = false; keys.l = false; }
  if (input.guard || keys.u) p1.guard(); else p1.unguard();
  if (keys[' ']) { p1.jump(); keys[' '] = false; }
}

// ============================================================
// STAGES
// ============================================================
const STAGES = [
  { // China town
    sky1: '#1a0a2e', sky2: '#3d1f6d',
    ground: '#2a1a3a', grid: '#4a2a6a',
    edge: '#ff4444', tiles: '#3a2a5a',
    accent: '#ffcc00'
  },
  { // Dojo
    sky1: '#1a1a0a', sky2: '#3d3d1f',
    ground: '#2a2a1a', grid: '#4a4a2a',
    edge: '#ffaa00', tiles: '#3a3a2a',
    accent: '#ff8800'
  },
  { // Street
    sky1: '#0a1a2e', sky2: '#1f3d6d',
    ground: '#1a2a3a', grid: '#2a4a6a',
    edge: '#44aaff', tiles: '#2a3a5a',
    accent: '#00ccff'
  },
];
let currentStage = 0;

function drawStage() {
  const st = STAGES[currentStage];
  const sg = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sg.addColorStop(0, st.sky1); sg.addColorStop(1, st.sky2);
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, GROUND_Y + 50);

  // Stars
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137.5 + 50) % W, sy = (i * 73.7 + 20) % (GROUND_Y * 0.6);
    const ss = 1 + (i % 3);
    ctx.globalAlpha = 0.3 + Math.sin(Date.now() / 1000 + i) * 0.3;
    ctx.fillRect(sx, sy, ss, ss);
  }
  ctx.globalAlpha = 1;

  const gt = GROUND_Y - STAGE_DEPTH * 0.3, gb = GROUND_Y + 30;
  ctx.fillStyle = st.ground;
  ctx.fillRect(0, gt, W, gb - gt);

  ctx.strokeStyle = st.grid; ctx.lineWidth = 1; ctx.globalAlpha = 0.4;
  for (let i = 0; i <= 10; i++) {
    const y = gt + (i / 10) * (gb - gt);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let i = 0; i <= 16; i++) {
    const t = i / 16;
    ctx.beginPath(); ctx.moveTo(W * 0.3 + t * W * 0.4, gt); ctx.lineTo(t * W, gb); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = st.edge; ctx.lineWidth = 2; ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.moveTo(STAGE_WIDTH_MIN, gb); ctx.lineTo(W * 0.3, gt); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(STAGE_WIDTH_MAX, gb); ctx.lineTo(W * 0.7, gt); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.fillStyle = st.tiles;
  for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) {
    ctx.fillRect(W * 0.2 + i * W * 0.08 + j * 15, gt + 20 + j * 25, 20 * SCALE, 8 * SCALE);
  }

  // Stage name
  ctx.fillStyle = st.accent;
  ctx.globalAlpha = 0.3;
  ctx.font = `bold ${20 * SCALE}px 'Courier New'`;
  ctx.textAlign = 'center';
  const stageNames = ['CHINA TOWN', 'ANCIENT DOJO', 'NEON STREET'];
  ctx.fillText(stageNames[currentStage], W / 2, gt - 10);
  ctx.globalAlpha = 1;
}

// ============================================================
// PARTICLES & EFFECTS
// ============================================================
const particles = [];
function spawnHit(x, y, color) {
  for (let i = 0; i < 8; i++)
    particles.push({ x, y, vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.5) * 300,
      life: 0.3 + Math.random() * 0.2, size: 2 + Math.random() * 4,
      color: Math.random() < 0.5 ? '#ffcc00' : (color || '#ff4444') });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / 0.5; ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

let shakeX = 0, shakeY = 0, shakeDur = 0;
function triggerShake(i, d) { shakeX = i; shakeY = i; shakeDur = d; }
function updateShake(dt) {
  if (shakeDur > 0) { shakeDur -= dt; shakeX = (Math.random() - 0.5) * shakeX * 2; shakeY = (Math.random() - 0.5) * shakeY * 2; }
  else { shakeX = 0; shakeY = 0; }
}

function showCombo(c) {
  const el = document.getElementById('combo-display');
  el.textContent = c + ' COMBO!'; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 1500);
}

function showRoundText(t) {
  const el = document.getElementById('round-text');
  el.textContent = t; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2000);
}

// ============================================================
// ROUND MANAGEMENT
// ============================================================
function startRound() {
  createFighters();
  currentStage = Math.floor(Math.random() * STAGES.length);
  roundTimer = ROUND_TIME; lastTimerUpdate = Date.now();
  gameState = 'intro'; introTimer = 2;
  showRoundText('ROUND ' + round);
}

function endRound(winner) {
  gameState = 'roundEnd'; roundEndTimer = 2;
  if (winner === 'p1') p1Wins++;
  else if (winner === 'p2') p2Wins++;
  showRoundText('K.O.!');
}

function checkRoundEnd() {
  if (p1.hp <= 0) { endRound('p2'); return true; }
  if (p2.hp <= 0) { endRound('p1'); return true; }
  if (roundTimer <= 0) {
    if (p1.hp > p2.hp) endRound('p1');
    else if (p2.hp > p1.hp) endRound('p2');
    else endRound('draw');
    return true;
  }
  return false;
}

function showWinner(t) {
  document.getElementById('winner-text').textContent = t;
  document.getElementById('winner-screen').classList.add('active');
  gameState = 'gameOver';
}

function buildSelectScreen() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  CHARACTERS.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = 'char-card' + (i === p1CharIdx ? ' selected' : '');

    // Mini preview canvas
    const cv = document.createElement('canvas');
    cv.width = 32; cv.height = 44;
    const cc = cv.getContext('2d');
    const sprites = generateSpriteSet(ch);
    const hair = HAIR_STYLES[ch.hairStyle] || [];
    const img = renderSprite(sprites.idle, ch.palette, 2, 2, hair, ch.palette[8]);
    cc.drawImage(img, 0, 0);

    const nm = document.createElement('div');
    nm.className = 'cname'; nm.textContent = ch.name;
    const tp = document.createElement('div');
    tp.className = 'ctype'; tp.textContent = ch.type;

    card.appendChild(cv); card.appendChild(nm); card.appendChild(tp);
    card.addEventListener('click', () => {
      p1CharIdx = i;
      document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      const info = document.getElementById('char-info');
      info.innerHTML = `<h3>${ch.name}</h3><p>${ch.desc}</p><p>攻击:${'★'.repeat(Math.round(ch.stats.atk*5/1.4))} 防御:${'★'.repeat(Math.round(ch.stats.def*5/1.3))} 速度:${'★'.repeat(Math.round(ch.stats.spd*5/1.3))}</p>`;
    });
    grid.appendChild(card);
  });
  // Pick random opponent
  do { p2CharIdx = Math.floor(Math.random() * CHARACTERS.length); } while (p2CharIdx === p1CharIdx);
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = 0;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (gameState === 'start' || gameState === 'select') return;

  if (hitPause > 0) { hitPause -= dt; return; }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  switch (gameState) {
    case 'intro':
      introTimer -= dt;
      if (introTimer <= 0) { gameState = 'fighting'; showRoundText('FIGHT!'); }
      break;
    case 'fighting':
      processInput();
      AI.update(dt, p2, p1);
      p1.update(dt, p2); p2.update(dt, p1);
      checkAttack(p1, p2); checkAttack(p2, p1);
      if (p1.flashTimer > 0.12 && p1.flashTimer < 0.15) {
        const d = p1.getDraw(); spawnHit(d.sx, d.sy - d.h * 0.5, p2.charData.specialColor); triggerShake(4, 0.1);
      }
      if (p2.flashTimer > 0.12 && p2.flashTimer < 0.15) {
        const d = p2.getDraw(); spawnHit(d.sx, d.sy - d.h * 0.5, p1.charData.specialColor); triggerShake(4, 0.1);
      }
      updateParticles(dt); updateShake(dt);
      if (Date.now() - lastTimerUpdate > 1000) { roundTimer--; lastTimerUpdate = Date.now(); }
      checkRoundEnd();
      break;
    case 'roundEnd':
      roundEndTimer -= dt;
      p1.update(dt, p2); p2.update(dt, p1);
      updateParticles(dt); updateShake(dt);
      if (roundEndTimer <= 0) {
        round++;
        if (p1Wins >= 2) showWinner(CHARACTERS[p1CharIdx].name + ' WINS!');
        else if (p2Wins >= 2) showWinner(CHARACTERS[p2CharIdx].name + ' WINS!');
        else if (round > MAX_ROUNDS) showWinner(p1Wins > p2Wins ? CHARACTERS[p1CharIdx].name + ' WINS!' : CHARACTERS[p2CharIdx].name + ' WINS!');
        else startRound();
      }
      break;
  }

  drawStage();
  const fighters = [p1, p2].sort((a, b) => a.z - b.z);
  for (const f of fighters) f.draw(ctx);
  drawParticles(); drawHUD();
  ctx.restore();
}

// ============================================================
// SCREEN NAVIGATION
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (id) document.getElementById(id).classList.add('active');
}

document.getElementById('btn-start').addEventListener('click', () => {
  showScreen('select-screen');
  gameState = 'select';
  buildSelectScreen();
});

document.getElementById('btn-fight').addEventListener('click', () => {
  showScreen(null);
  round = 1; p1Wins = 0; p2Wins = 0;
  startRound();
  requestAnimationFrame(gameLoop);
});

document.getElementById('btn-restart').addEventListener('click', () => {
  showScreen('select-screen');
  gameState = 'select';
  buildSelectScreen();
});

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// Initial draw
drawStage();
</script>
