<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KOF Retro - 拳皇怀旧格斗</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#ui-overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  font-family: 'Courier New', monospace;
}
/* Start Screen */
#start-screen {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85);
  z-index: 10;
  pointer-events: all;
}
#start-screen h1 {
  font-size: 14vw; color: #ff4444;
  text-shadow: 0 0 20px #ff0000, 3px 3px 0 #880000;
  font-family: 'Courier New', monospace;
  letter-spacing: 4px;
  animation: pulse 1.5s ease-in-out infinite;
}
#start-screen h2 {
  font-size: 5vw; color: #ffcc00;
  text-shadow: 0 0 10px #ff8800;
  margin: 2vh 0;
  font-family: 'Courier New', monospace;
}
#start-screen .subtitle {
  font-size: 3.5vw; color: #aaa;
  margin-bottom: 4vh;
  font-family: 'Courier New', monospace;
}
#start-screen button {
  font-size: 5vw; padding: 2vh 8vw;
  background: linear-gradient(180deg, #ff4444, #cc0000);
  color: #fff; border: 2px solid #ff8888;
  border-radius: 4px; cursor: pointer;
  font-family: 'Courier New', monospace;
  text-shadow: 1px 1px 0 #000;
  animation: blink 1s step-end infinite;
}
#start-screen button:active {
  background: linear-gradient(180deg, #cc0000, #880000);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
@keyframes blink {
  50% { opacity: 0.7; }
}
/* HUD */
#hud {
  position: absolute; top: 0; left: 0;
  width: 100%; padding: 1vh 2vw;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none;
}
.health-bar-container {
  width: 35%; height: 3vh;
  background: #222; border: 2px solid #888;
  border-radius: 2px; overflow: hidden;
  position: relative;
}
.health-bar {
  height: 100%; transition: width 0.3s;
}
#p1-health { background: linear-gradient(180deg, #44ff44, #00aa00); float: right; }
#p2-health { background: linear-gradient(180deg, #44ff44, #00aa00); }
.health-bar-container.p1 { float: right; }
#timer {
  font-size: 5vw; color: #ffcc00;
  text-shadow: 0 0 10px #ff8800, 2px 2px 0 #000;
  min-width: 10vw; text-align: center;
  font-family: 'Courier New', monospace;
}
#round-text {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 12vw; color: #ffcc00;
  text-shadow: 0 0 30px #ff8800, 3px 3px 0 #884400;
  font-family: 'Courier New', monospace;
  display: none; z-index: 5;
  animation: roundPop 0.8s ease-out;
}
@keyframes roundPop {
  0% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  60% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
#combo-display {
  position: absolute; top: 15vh; right: 5vw;
  font-size: 6vw; color: #ff4444;
  text-shadow: 0 0 15px #ff0000, 2px 2px 0 #000;
  font-family: 'Courier New', monospace;
  display: none;
}
/* Touch Controls */
#controls {
  position: absolute; bottom: 0; left: 0;
  width: 100%; height: 35vh;
  pointer-events: all;
  display: flex; justify-content: space-between;
  align-items: flex-end;
  padding: 0 3vw 2vh;
}
#joystick-area {
  width: 30vw; height: 30vw;
  position: relative;
  max-width: 150px; max-height: 150px;
}
#joystick-base {
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  position: relative;
}
#joystick-stick {
  width: 40%; height: 40%;
  background: rgba(255,255,255,0.5);
  border: 2px solid rgba(255,255,255,0.7);
  border-radius: 50%;
  position: absolute;
  top: 30%; left: 30%;
  transition: none;
}
#btn-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 2vw;
  width: 35vw; height: 30vw;
  max-width: 180px; max-height: 180px;
}
.btn-attack {
  border-radius: 50%;
  border: 2px solid;
  font-size: 3.5vw;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#btn-punch { background: rgba(255,100,100,0.6); border-color: #ff4444; grid-column: 1; grid-row: 2; }
#btn-kick { background: rgba(100,100,255,0.6); border-color: #4444ff; grid-column: 2; grid-row: 2; }
#btn-special { background: rgba(255,200,0,0.6); border-color: #ffcc00; grid-column: 2; grid-row: 1; }
#btn-guard { background: rgba(100,255,100,0.6); border-color: #44ff44; grid-column: 1; grid-row: 1; }
.btn-attack:active, .btn-attack.active {
  transform: scale(0.9);
  filter: brightness(1.5);
}
/* Scanline effect */
#scanlines {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px

  pointer-events: none;
  opacity: 0.3;

/* Winner screen */
#winner-screen {

  width: 100%; height: 100%;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;

#winner-screen button {

  border: 2px solid #ff4444; border-radius: 4px;
  margin-top: 3vh; cursor: pointer;
  font-family: 'Courier New', monospace;

// --- Cache rendered sprites ---
const spriteCache = {};
function renderSprite(spriteData, palette, scaleX, scaleY) {
  const key = JSON.stringify(spriteData) + JSON.stringify(palette) + scaleX + scaleY;
  if (spriteCache[key]) return spriteCache[key];

  const sw = spriteData[0].length;
  const sh = spriteData.length;
  const px = Math.ceil(sw * scaleX);
  const py = Math.ceil(sh * scaleY);
  const offCanvas = document.createElement('canvas');
  offCanvas.width = px;
  offCanvas.height = py;
  const offCtx = offCanvas.getContext('2d');

  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const v = spriteData[y][x];
      if (v === 0) continue;
      offCtx.fillStyle = palette[v];
      offCtx.fillRect(Math.floor(x * scaleX), Math.floor(y * scaleY),
                       Math.ceil(scaleX), Math.ceil(scaleY));
    }
  }
  spriteCache[key] = offCanvas;
  return offCanvas;
}

// --- Fighter Class ---
class Fighter {
  constructor(x, z, palette, facing, name) {
    this.x = x;
    this.z = z;           // depth (0=far, 1=near)
    this.vx = 0;
    this.vz = 0;
    this.vy = 0;
    this.y = 0;           // jump height
    this.grounded = true;
    this.palette = palette;
    this.facing = facing; // 1=right, -1=left
    this.name = name;
    this.hp = 100;
    this.state = 'idle';  // idle, walk, punch, kick, guard, hit, special
    this.stateTimer = 0;
    this.animFrame = 0;
    this.attackHit = false;
    this.combo = 0;
    this.comboTimer = 0;
    this.hitstun = 0;
    this.flashTimer = 0;
    this.specialMeter = 0;
  }

  get spriteWidth() { return 16; }
  get spriteHeight() { return 22; }

  getScreenPos() {
    // 45-degree perspective: map z to ground position and scale
    const depthFactor = 0.5 + this.z * 0.5; // 0.5 to 1.0
    const screenX = this.x;
    const groundY = GROUND_Y - (1 - this.z) * STAGE_DEPTH * 0.3;
    const screenY = groundY - this.y;
    return { x: screenX, y: screenY, scale: depthFactor };
  }

  getDrawSize() {
    const pos = this.getScreenPos();
    const baseSize = 3.5 * SCALE;
    const s = baseSize * pos.scale;
    return {
      w: this.spriteWidth * s,
      h: this.spriteHeight * s,
      scale: s,
      screenX: pos.x,
      screenY: pos.y
    };
  }

  getHitbox() {
    const d = this.getDrawSize();
    return {
      x: d.screenX - d.w * 0.3,
      y: d.screenY - d.h,
      w: d.w * 0.6,
      h: d.h
    };
  }

  getAttackBox() {
    if (this.state !== 'punch' && this.state !== 'kick' && this.state !== 'special') return null;
    if (this.attackHit) return null;
    const d = this.getDrawSize();
    const range = this.state === 'special' ? d.w * 1.5 : (this.state === 'kick' ? d.w * 1.0 : d.w * 0.8);
    return {
      x: this.facing === 1 ? d.screenX : d.screenX - range,
      y: d.screenY - d.h * 0.7,
      w: range,
      h: d.h * 0.5
    };
  }

  update(dt, opponent) {
    // Auto-face opponent
    if (this.state !== 'hit' && this.state !== 'punch' && this.state !== 'kick' && this.state !== 'special') {
      this.facing = opponent.x > this.x ? 1 : -1;
    }

    // State timers
    if (this.stateTimer > 0) {
      this.stateTimer -= dt;
      if (this.stateTimer <= 0) {
        if (this.state === 'punch' || this.state === 'kick' || this.state === 'special') {
          this.state = 'idle';
          this.attackHit = false;
        }
        if (this.state === 'hit') {
          this.state = 'idle';
          this.hitstun = 0;
        }
      }
    }

    // Hitstun
    if (this.hitstun > 0) {
      this.hitstun -= dt;
      this.state = 'hit';
    }

    // Flash
    if (this.flashTimer > 0) this.flashTimer -= dt;

    // Combo timer
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }

    // Movement
    this.x += this.vx * dt;
    this.z += this.vz * dt;
    this.z = Math.max(0.2, Math.min(1, this.z));

    // Keep in bounds
    const d = this.getDrawSize();
    this.x = Math.max(STAGE_WIDTH_MIN + d.w / 2, Math.min(STAGE_WIDTH_MAX - d.w / 2, this.x));

    // Gravity
    if (!this.grounded) {
      this.vy += GRAVITY;
      this.y -= this.vy;
      if (this.y <= 0) {
        this.y = 0;
        this.vy = 0;
        this.grounded = true;
      }
    }

    // Special meter regen
    if (this.specialMeter < 100) {
      this.specialMeter = Math.min(100, this.specialMeter + dt * 3);
    }
  }

  punch() {
    if (this.state !== 'idle' && this.state !== 'walk') return;
    this.state = 'punch';
    this.stateTimer = 0.3;
    this.attackHit = false;
  }

  kick() {
    if (this.state !== 'idle' && this.state !== 'walk') return;
    this.state = 'kick';
    this.stateTimer = 0.4;
    this.attackHit = false;
  }

  special() {
    if (this.specialMeter < 50) return;
    if (this.state !== 'idle' && this.state !== 'walk') return;
    this.state = 'special';
    this.stateTimer = 0.6;
    this.attackHit = false;
    this.specialMeter -= 50;
  }

  guard() {
    if (this.state === 'idle' || this.state === 'walk' || this.state === 'guard') {
      this.state = 'guard';
    }
  }

  unguard() {
    if (this.state === 'guard') this.state = 'idle';
  }

  jump() {
    if (!this.grounded) return;
    this.grounded = false;
    this.vy = 12;
  }

  takeDamage(dmg, attackerX) {
    if (this.state === 'guard') {
      dmg = Math.floor(dmg * 0.2);
      this.hitstun = 0.1;
    } else {
      this.hitstun = 0.4;
      this.state = 'hit';
    }
    this.hp = Math.max(0, this.hp - dmg);
    this.flashTimer = 0.15;
    // Knockback
    const kb = attackerX < this.x ? 3 : -3;
    this.x += kb;
  }

  draw(ctx) {
    const d = this.getDrawSize();
    const sprites = {
      idle: SPRITE_IDLE_1,
      walk: SPRITE_IDLE_1,
      punch: SPRITE_PUNCH,
      kick: SPRITE_KICK,
      guard: SPRITE_GUARD,
      hit: SPRITE_IDLE_1,
      special: SPRITE_PUNCH,
    };
    let spriteData = sprites[this.state] || SPRITE_IDLE_1;

    // Animation bob for idle
    let offsetY = 0;
    if (this.state === 'idle') {
      offsetY = Math.sin(Date.now() / 300) * 2 * d.scale;
    }
    if (this.state === 'hit') {
      offsetY = Math.sin(Date.now() / 50) * 3 * d.scale;
    }

    ctx.save();
    // Flash on hit
    if (this.flashTimer > 0 && Math.floor(this.flashTimer * 30) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }

    // Draw shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(d.screenX, d.screenY + 2, d.w * 0.4, d.w * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Draw sprite
    const img = renderSprite(spriteData, this.palette, d.scale, d.scale);
    const drawX = d.screenX - d.w / 2;
    const drawY = d.screenY - d.h + offsetY;

    if (this.facing === -1) {
      ctx.save();
      ctx.translate(d.screenX, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, -d.w / 2, drawY);
      ctx.restore();
    } else {
      ctx.drawImage(img, drawX, drawY);
    }

    // Special effect for special attack
    if (this.state === 'special') {
      const progress = 1 - (this.stateTimer / 0.6);
      const radius = d.w * 0.8 * progress;
      ctx.strokeStyle = this.palette === PALETTE_P1 ? '#ff4444' : '#4444ff';
      ctx.lineWidth = 3 * d.scale;
      ctx.globalAlpha = 0.7 * (1 - progress);
      ctx.beginPath();
      ctx.arc(d.screenX + this.facing * d.w * 0.3, d.screenY - d.h * 0.5,
              radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // Debug hitboxes (comment out for release)
    // this.drawDebugHitboxes(ctx, d);
  }

  drawDebugHitboxes(ctx, d) {
    const hb = this.getHitbox();
    ctx.strokeStyle = 'lime';
    ctx.lineWidth = 1;
    ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
    const ab = this.getAttackBox();
    if (ab) {
      ctx.strokeStyle = 'red';
      ctx.strokeRect(ab.x, ab.y, ab.w, ab.h);
    }
  }

  reset(x) {
    this.x = x;
    this.z = 0.7;
    this.vx = 0; this.vz = 0; this.vy = 0;
    this.y = 0;
    this.grounded = true;
    this.hp = 100;
    this.state = 'idle';
    this.stateTimer = 0;
    this.attackHit = false;
    this.combo = 0;
    this.comboTimer = 0;
    this.hitstun = 0;
    this.flashTimer = 0;
    this.specialMeter = 0;
  }
}

// --- Create fighters ---
let p1 = new Fighter(W * 0.3, 0.7, PALETTE_P1, 1, 'PLAYER');
let p2 = new Fighter(W * 0.7, 0.7, PALETTE_P2, -1, 'CPU');

// --- AI System ---
const AI = {
  thinkTimer: 0,
  action: 'idle',
  actionTimer: 0,

  update(dt, cpu, player) {
    this.thinkTimer -= dt;
    this.actionTimer -= dt;

    if (this.thinkTimer <= 0) {
      this.thinkTimer = 0.3 + Math.random() * 0.4;
      this.decide(cpu, player);
    }

    if (this.actionTimer > 0) {
      this.execute(cpu, player);
    } else {
      cpu.vx = 0;
      cpu.vz = 0;
    }
  },

  decide(cpu, player) {
    const dx = player.x - cpu.x;
    const dz = player.z - cpu.z;
    const dist = Math.abs(dx);
    const d = cpu.getDrawSize();
    const closeRange = d.w * 1.2;
    const midRange = d.w * 2.5;

    // If player is attacking, try to guard
    if ((player.state === 'punch' || player.state === 'kick' || player.state === 'special')
        && dist < midRange && Math.random() < 0.5) {
      this.action = 'guard';
      this.actionTimer = 0.5;
      return;
    }

    if (dist > midRange) {
      // Move closer
      this.action = 'approach';
      this.actionTimer = 0.5;
    } else if (dist < closeRange) {
      // In range - attack or retreat
      const r = Math.random();
      if (r < 0.35) {
        this.action = 'punch';
        this.actionTimer = 0.3;
      } else if (r < 0.6) {
        this.action = 'kick';
        this.actionTimer = 0.4;
      } else if (r < 0.7 && cpu.specialMeter >= 50) {
        this.action = 'special';
        this.actionTimer = 0.6;
      } else {
        this.action = 'retreat';
        this.actionTimer = 0.3;
      }
    } else {
      // Mid range
      const r = Math.random();
      if (r < 0.4) {
        this.action = 'approach';
        this.actionTimer = 0.3;
      } else if (r < 0.6) {
        this.action = 'punch';
        this.actionTimer = 0.3;
      } else if (r < 0.75) {
        // Adjust depth
        this.action = Math.random() < 0.5 ? 'depthUp' : 'depthDown';
        this.actionTimer = 0.3;
      } else {
        this.action = 'idle';
        this.actionTimer = 0.2;
      }
    }
  },

  execute(cpu, player) {
    const speed = 200;
    cpu.vx = 0;
    cpu.vz = 0;

    switch (this.action) {
      case 'approach':
        cpu.vx = (player.x > cpu.x ? 1 : -1) * speed;
        cpu.state = cpu.state === 'guard' ? 'guard' : 'idle';
        break;
      case 'retreat':
        cpu.vx = (player.x > cpu.x ? -1 : 1) * speed * 0.7;
        break;
      case 'punch':
        cpu.punch();
        this.actionTimer = 0;
        break;
      case 'kick':
        cpu.kick();
        this.actionTimer = 0;
        break;
      case 'special':
        cpu.special();
        this.actionTimer = 0;
        break;
      case 'guard':
        cpu.guard();
        break;
      case 'depthUp':
        cpu.vz = -speed * 0.003;
        break;
      case 'depthDown':
        cpu.vz = speed * 0.003;
        break;
    }
  }
};

// --- Collision Detection ---
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function checkAttack(attacker, defender) {
  const atkBox = attacker.getAttackBox();
  if (!atkBox) return;
  const defBox = defender.getHitbox();
  if (rectsOverlap(atkBox, defBox)) {
    attacker.attackHit = true;
    let dmg = 0;
    if (attacker.state === 'punch') dmg = 8 + Math.random() * 4;
    else if (attacker.state === 'kick') dmg = 12 + Math.random() * 5;
    else if (attacker.state === 'special') dmg = 25 + Math.random() * 10;

    // Combo bonus
    attacker.combo++;
    attacker.comboTimer = 1.5;
    if (attacker.combo > 1) {
      dmg *= (1 + attacker.combo * 0.15);
    }

    dmg = Math.floor(dmg);
    defender.takeDamage(dmg, attacker.x);

    // Hit pause for impact feel
    hitPause = 0.05;

    // Show combo
    if (attacker.combo > 1) {
      showCombo(attacker.combo);
    }
  }
}

// --- Input System (Touch) ---
const input = {
  dx: 0, dy: 0,
  punch: false, kick: false, special: false, guard: false,
  jump: false
};

// Joystick
const joystickArea = document.getElementById('joystick-area');
const joystickStick = document.getElementById('joystick-stick');
let joystickTouch = null;
let joystickCenter = { x: 0, y: 0 };

function getJoystickCenter() {
  const rect = joystickArea.getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

joystickArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  joystickTouch = touch.identifier;
  joystickCenter = getJoystickCenter();
  handleJoystickMove(touch);
});

joystickArea.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouch) {
      handleJoystickMove(touch);
    }
  }
});

joystickArea.addEventListener('touchend', (e) => {
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouch) {
      joystickTouch = null;
      input.dx = 0;
      input.dy = 0;
      joystickStick.style.transform = 'translate(0,0)';
    }
  }
});

function handleJoystickMove(touch) {
  const rect = joystickArea.getBoundingClientRect();
  const maxR = rect.width / 2;
  let dx = touch.clientX - joystickCenter.x;
  let dy = touch.clientY - joystickCenter.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > maxR) {
    dx = dx / dist * maxR;
    dy = dy / dist * maxR;
  }
  input.dx = dx / maxR;
  input.dy = dy / maxR;
  joystickStick.style.transform = `translate(${dx * 0.6}px, ${dy * 0.6}px)`;
}

// Buttons
function setupButton(id, key) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    input[key] = true;
    btn.classList.add('active');
  });
  btn.addEventListener('touchend', (e) => {
    input[key] = false;
    btn.classList.remove('active');
  });
  // Mouse fallback for desktop testing
  btn.addEventListener('mousedown', (e) => {
    input[key] = true;
    btn.classList.add('active');
  });
  btn.addEventListener('mouseup', (e) => {
    input[key] = false;
    btn.classList.remove('active');
  });
}

// Desktop keyboard support
const keys = {};
document.addEventListener('keydown', (e) => { keys[e.key] = true; });
document.addEventListener('keyup', (e) => { keys[e.key] = false; });

function processInput() {
  const speed = 250;
  p1.vx = 0;
  p1.vz = 0;

  // Keyboard
  let dx = input.dx, dy = input.dy;
  if (keys['ArrowLeft'] || keys['a']) dx = -1;
  if (keys['ArrowRight'] || keys['d']) dx = 1;
  if (keys['ArrowUp'] || keys['w']) dy = -1;
  if (keys['ArrowDown'] || keys['s']) dy = 1;

  if (Math.abs(dx) > 0.2) p1.vx = dx * speed;
  if (Math.abs(dy) > 0.2) p1.vz = dy * speed * 0.003;

  if (input.punch || keys['j'] || keys['J']) { p1.punch(); input.punch = false; keys['j'] = false; }
  if (input.kick || keys['k'] || keys['K']) { p1.kick(); input.kick = false; keys['k'] = false; }
  if (input.special || keys['l'] || keys['L']) { p1.special(); input.special = false; keys['l'] = false; }
  if (input.guard || keys['u'] || keys['U']) { p1.guard(); } else { p1.unguard(); }
  if (keys[' ']) { p1.jump(); keys[' '] = false; }
}

// --- Stage Drawing ---
function drawStage() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  skyGrad.addColorStop(0, '#1a0a2e');
  skyGrad.addColorStop(1, '#3d1f6d');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, GROUND_Y + 50);

  // Stars
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137.5 + 50) % W;
    const sy = (i * 73.7 + 20) % (GROUND_Y * 0.6);
    const ss = 1 + (i % 3);
    const alpha = 0.3 + Math.sin(Date.now() / 1000 + i) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.fillRect(sx, sy, ss, ss);
  }
  ctx.globalAlpha = 1;

  // Ground - isometric grid
  const groundTop = GROUND_Y - STAGE_DEPTH * 0.3;
  const groundBottom = GROUND_Y + 30;

  // Ground base color
  ctx.fillStyle = '#2a1a3a';
  ctx.fillRect(0, groundTop, W, groundBottom - groundTop);

  // Grid lines (isometric diamond pattern)
  ctx.strokeStyle = '#4a2a6a';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.4;

  // Horizontal depth lines
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const y = groundTop + t * (groundBottom - groundTop);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Vertical perspective lines
  for (let i = 0; i <= 16; i++) {
    const t = i / 16;
    const xTop = W * 0.3 + t * (W * 0.4);
    const xBot = t * W;
    ctx.beginPath();
    ctx.moveTo(xTop, groundTop);
    ctx.lineTo(xBot, groundBottom);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Stage edges
  ctx.strokeStyle = '#ff4444';
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(STAGE_WIDTH_MIN, groundBottom);
  ctx.lineTo(W * 0.3, groundTop);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(STAGE_WIDTH_MAX, groundBottom);
  ctx.lineTo(W * 0.7, groundTop);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Ground decoration - tiles
  ctx.fillStyle = '#3a2a5a';
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 3; j++) {
      const tx = W * 0.2 + i * W * 0.08 + j * 15;
      const ty = groundTop + 20 + j * 25;
      ctx.fillRect(tx, ty, 20 * SCALE, 8 * SCALE);
    }
  }
}

// --- Hit Particles ---
const particles = [];
function spawnHitParticles(x, y) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 300,
      vy: (Math.random() - 0.5) * 300,
      life: 0.3 + Math.random() * 0.2,
      size: 2 + Math.random() * 4,
      color: Math.random() < 0.5 ? '#ffcc00' : '#ff4444'
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / 0.5;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// --- Screen Shake ---
let shakeX = 0, shakeY = 0, shakeDur = 0;
function triggerShake(intensity, duration) {
  shakeX = intensity;
  shakeY = intensity;
  shakeDur = duration;
}

function updateShake(dt) {
  if (shakeDur > 0) {
    shakeDur -= dt;
    shakeX = (Math.random() - 0.5) * shakeX * 2;
    shakeY = (Math.random() - 0.5) * shakeY * 2;
  } else {
    shakeX = 0;
    shakeY = 0;
  }
}

// --- Main Game Loop ---
let lastTime = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (gameState === 'start') return;

  // Hit pause
  if (hitPause > 0) {
    hitPause -= dt;
    return;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Update
  switch (gameState) {
    case 'intro':
      introTimer -= dt;
      if (introTimer <= 0) {
        gameState = 'fighting';
        showRoundText('FIGHT!');
      }
      break;

    case 'fighting':
      processInput();
      AI.update(dt, p2, p1);

      p1.update(dt, p2);
      p2.update(dt, p1);

      checkAttack(p1, p2);
      checkAttack(p2, p1);

      // Hit particles
      if (p1.flashTimer > 0.12 && p1.flashTimer < 0.15) {
        const d = p1.getDrawSize();
        spawnHitParticles(d.screenX, d.screenY - d.h * 0.5);
        triggerShake(4, 0.1);
      }
      if (p2.flashTimer > 0.12 && p2.flashTimer < 0.15) {
        const d = p2.getDrawSize();
        spawnHitParticles(d.screenX, d.screenY - d.h * 0.5);
        triggerShake(4, 0.1);
      }

      updateParticles(dt);
      updateShake(dt);

      // Timer
      if (Date.now() - lastTimerUpdate > 1000) {
        roundTimer--;
        lastTimerUpdate = Date.now();
      }

      checkRoundEnd();
      break;

    case 'roundEnd':
      roundEndTimer -= dt;
      p1.update(dt, p2);
      p2.update(dt, p1);
      updateParticles(dt);
      updateShake(dt);
      if (roundEndTimer <= 0) {
        round++;
        if (p1Wins >= 2) {
          showWinner('PLAYER 1 WINS!');
        } else if (p2Wins >= 2) {
          showWinner('CPU WINS!');
        } else if (round > MAX_ROUNDS) {
          if (p1Wins > p2Wins) showWinner('PLAYER 1 WINS!');
          else if (p2Wins > p1Wins) showWinner('CPU WINS!');
          else showWinner('DRAW!');
        } else {
          startRound();
        }
      }
      break;
  }

  // Draw
  drawStage();

  // Sort by depth for draw order
  const fighters = [p1, p2].sort((a, b) => a.z - b.z);
  for (const f of fighters) f.draw(ctx);

  drawParticles();
  drawHUD();

  ctx.restore();
}

// --- Start/Restart ---
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  round = 1;
  p1Wins = 0;
  p2Wins = 0;
  startRound();
  requestAnimationFrame(gameLoop);
});

document.getElementById('btn-restart').addEventListener('click', () => {
  document.getElementById('winner-screen').style.display = 'none';
  round = 1;
  p1Wins = 0;
  p2Wins = 0;
  spriteCache.length = 0; // clear cache
  Object.keys(spriteCache).forEach(k => delete spriteCache[k]);
  startRound();
});

// --- Prevent default touch behaviors ---
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

// Draw initial stage for start screen background
drawStage();
</script>
</body>
</html>
